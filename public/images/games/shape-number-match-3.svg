<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="50%" stop-color="#B2F5EA" />
      <stop offset="100%" stop-color="#81E6D9" />
    </linearGradient>

    <!-- Shape Gradients -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6AD55" />
      <stop offset="100%" stop-color="#DD6B20" />
    </linearGradient>

    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63B3ED" />
      <stop offset="100%" stop-color="#3182CE" />
    </linearGradient>

    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F687B3" />
      <stop offset="100%" stop-color="#D53F8C" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68D391" />
      <stop offset="100%" stop-color="#38A169" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B794F4" />
      <stop offset="100%" stop-color="#805AD5" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1A202C" flood-opacity="0.15" />
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#319795" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle Base -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.15" stroke="#2C7A7B" stroke-width="2" stroke-dasharray="6,6">
    <line x1="120" y1="50" x2="120" y2="450" />
    <line x1="250" y1="50" x2="250" y2="450" />
    <line x1="380" y1="50" x2="380" y2="450" />
    <line x1="50" y1="140" x2="450" y2="140" />
    <line x1="50" y1="260" x2="450" y2="260" />
    <line x1="50" y1="380" x2="450" y2="380" />
  </g>

  <!-- Math Puzzle Board Base -->
  <rect x="90" y="90" width="320" height="320" rx="36" fill="#FFFFFF" filter="url(#shadow)" opacity="0.9" />
  <rect x="105" y="105" width="290" height="290" rx="28" fill="#E6FFFA" stroke="#319795" stroke-width="4" stroke-dasharray="10,8" />

  <!-- Puzzle Slot 1: Star with Number 5 -->
  <g filter="url(#shadow)">
    <!-- Star Path -->
    <path d="M 175 140 L 186 166 L 214 167 L 191 183 L 200 210 L 175 193 L 150 210 L 159 183 L 136 167 L 164 166 Z" fill="url(#starGrad)" />
    <text x="175" y="182" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">5</text>
  </g>

  <!-- Puzzle Slot 2: Hexagon with Number 3 -->
  <g filter="url(#shadow)">
    <polygon points="325,145 355,162 355,198 325,215 295,198 295,162" fill="url(#hexGrad)" />
    <text x="325" y="180" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
  </g>

  <!-- Plus Operator Badge -->
  <g filter="url(#shadow)">
    <circle cx="250" cy="180" r="22" fill="#FAF089" stroke="#D69E2E" stroke-width="3" />
    <text x="250" y="180" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="26" fill="#744210" text-anchor="middle" dominant-baseline="central">+</text>
  </g>

  <!-- Equal Operator Badge -->
  <g filter="url(#shadow)">
    <circle cx="250" cy="315" r="22" fill="#FED7D7" stroke="#E53E3E" stroke-width="3" />
    <text x="250" y="315" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="26" fill="#742A2A" text-anchor="middle" dominant-baseline="central">=</text>
  </g>

  <!-- Puzzle Slot 3: Circle with Number 8 -->
  <g filter="url(#shadow)">
    <circle cx="175" cy="315" r="38" fill="url(#circleGrad)" />
    <text x="175" y="315" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">8</text>
  </g>

  <!-- Puzzle Piece Target Slot (Question Mark / Star) -->
  <g filter="url(#shadow)">
    <rect x="287" y="277" width="76" height="76" rx="20" fill="url(#purpleGrad)" />
    <!-- Floating Puzzle Piece Notch -->
    <path d="M 325 290 L 333 300 L 345 300 L 336 310 L 340 322 L 325 314 L 310 322 L 314 310 L 305 300 L 317 300 Z" fill="#FFE866" />
    <text x="325" y="338" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">SOLVE</text>
  </g>

  <!-- Sparkles and Stars Decor -->
  <g fill="#F6AD55">
    <path d="M 70 120 L 73 128 L 81 131 L 73 134 L 70 142 L 67 134 L 59 131 L 67 128 Z" />
    <path d="M 420 340 L 423 348 L 431 351 L 423 354 L 420 362 L 417 354 L 409 351 L 417 348 Z" />
    <circle cx="430" cy="110" r="8" fill="#68D391" />
    <circle cx="75" cy="380" r="10" fill="#F687B3" />
  </g>

  <!-- Glowing Trophy / Ribbon Mini Badge -->
  <g filter="url(#shadow)">
    <circle cx="250" cy="390" r="28" fill="#F6AD55" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 242 384 L 250 376 L 258 384 L 258 396 L 242 396 Z" fill="#FFFFFF" />
    <circle cx="250" cy="390" r="5" fill="#DD6B20" />
  </g>
</svg>
