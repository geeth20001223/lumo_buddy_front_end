<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft Teal/Emerald Background Gradient -->
    <linearGradient id="bgGradLvl2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="50%" stop-color="#B2F5EA" />
      <stop offset="100%" stop-color="#4FD1C5" />
    </linearGradient>

    <!-- Number Block Gradients -->
    <linearGradient id="blockOne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A65" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>

    <linearGradient id="blockTwo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>

    <linearGradient id="blockThree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AED581" />
      <stop offset="100%" stop-color="#689F38" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F7FAFC" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadowLvl2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1A202C" flood-opacity="0.15" />
    </filter>

    <filter id="glowLvl2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#319795" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle Base -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGradLvl2)" filter="url(#glowLvl2)" />

  <!-- Dotted Connection Path -->
  <path d="M 130 200 C 180 150, 320 150, 370 200 C 320 320, 180 320, 130 200 Z" stroke="#319795" stroke-width="4" stroke-dasharray="8,8" fill="none" opacity="0.4" />

  <!-- Left Pair: Number 1 & 1 Dot Card -->
  <g filter="url(#shadowLvl2)">
    <!-- Number 1 Block -->
    <rect x="90" y="140" width="90" height="90" rx="24" fill="url(#blockOne)" />
    <text x="135" y="185" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
    
    <!-- Matching Card with 1 Dot -->
    <rect x="90" y="250" width="90" height="90" rx="24" fill="url(#cardGrad)" stroke="#FF8A65" stroke-width="4" />
    <circle cx="135" cy="295" r="16" fill="#E64A19" />
  </g>

  <!-- Middle Pair: Number 2 & 2 Dots Card -->
  <g filter="url(#shadowLvl2)">
    <!-- Number 2 Block -->
    <rect x="205" y="110" width="90" height="90" rx="24" fill="url(#blockTwo)" />
    <text x="250" y="155" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>

    <!-- Matching Card with 2 Dots -->
    <rect x="205" y="280" width="90" height="90" rx="24" fill="url(#cardGrad)" stroke="#4FC3F7" stroke-width="4" />
    <circle cx="230" cy="325" r="13" fill="#0288D1" />
    <circle cx="270" cy="325" r="13" fill="#0288D1" />
  </g>

  <!-- Right Pair: Number 3 & 3 Dots Card -->
  <g filter="url(#shadowLvl2)">
    <!-- Number 3 Block -->
    <rect x="320" y="140" width="90" height="90" rx="24" fill="url(#blockThree)" />
    <text x="365" y="185" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>

    <!-- Matching Card with 3 Dots -->
    <rect x="320" y="250" width="90" height="90" rx="24" fill="url(#cardGrad)" stroke="#AED581" stroke-width="4" />
    <circle cx="345" cy="275" r="11" fill="#689F38" />
    <circle cx="385" cy="275" r="11" fill="#689F38" />
    <circle cx="365" cy="315" r="11" fill="#689F38" />
  </g>

  <!-- Sparkles & Stars -->
  <g fill="#F6AD55" opacity="0.9">
    <path d="M 250 55 L 254 67 L 266 71 L 254 75 L 250 87 L 246 75 L 234 71 L 246 67 Z" />
    <path d="M 70 360 L 73 368 L 81 371 L 73 374 L 70 382 L 67 374 L 59 371 L 67 368 Z" />
    <path d="M 430 360 L 433 368 L 441 371 L 433 374 L 430 382 L 427 374 L 419 371 L 427 368 Z" />
    <circle cx="70" cy="100" r="8" fill="#4FD1C5" />
    <circle cx="430" cy="100" r="10" fill="#FF8A65" />
  </g>

  <!-- Level 2 Label Pill -->
  <g filter="url(#shadowLvl2)">
    <rect x="170" y="395" width="160" height="42" rx="21" fill="#2B6CB0" stroke="#FFFFFF" stroke-width="3" />
    <text x="250" y="418" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">MATCH QUANTITY</text>
  </g>
</svg>
