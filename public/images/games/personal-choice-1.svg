<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPC1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCBF" />
      <stop offset="50%" stop-color="#FBD38D" />
      <stop offset="100%" stop-color="#F6AD55" />
    </linearGradient>

    <linearGradient id="applePC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEB2B2" />
      <stop offset="100%" stop-color="#E53E3E" />
    </linearGradient>

    <linearGradient id="waterPC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90CDF4" />
      <stop offset="100%" stop-color="#3182CE" />
    </linearGradient>

    <filter id="shadowPC1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#744210" flood-opacity="0.15" />
    </filter>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#bgGradPC1)" />

  <!-- Expressing Needs Cards: Water Glass, Apple, Cushion -->
  <g filter="url(#shadowPC1)">
    <!-- Water Glass Card -->
    <rect x="90" y="140" width="90" height="110" rx="22" fill="#FFFFFF" stroke="#3182CE" stroke-width="4" />
    <path d="M 120 170 L 160 170 L 155 220 C 155 225 150 230 145 230 L 135 230 C 130 230 125 225 125 220 Z" fill="url(#waterPC)" />
    <text x="135" y="240" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="11" fill="#2B6CB0" text-anchor="middle">WATER</text>

    <!-- Apple Card -->
    <rect x="205" y="110" width="90" height="110" rx="22" fill="#FFFFFF" stroke="#E53E3E" stroke-width="4" />
    <circle cx="250" cy="155" r="22" fill="url(#applePC)" />
    <path d="M 250 133 Q 253 127 258 130" stroke="#2F855A" stroke-width="3" fill="none" />
    <text x="250" y="210" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="11" fill="#C53030" text-anchor="middle">SNACK</text>

    <!-- Rest Pillow Card -->
    <rect x="320" y="140" width="90" height="110" rx="22" fill="#FFFFFF" stroke="#D69E2E" stroke-width="4" />
    <rect x="335" y="165" width="60" height="40" rx="12" fill="#F6E05E" stroke="#D69E2E" stroke-width="2" />
    <text x="365" y="240" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="11" fill="#744210" text-anchor="middle">REST</text>
  </g>

  <!-- Level Badge Pill -->
  <g filter="url(#shadowPC1)">
    <rect x="150" y="390" width="200" height="44" rx="22" fill="#DD6B20" stroke="#FFFFFF" stroke-width="3" />
    <text x="250" y="412" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">EXPRESSING NEEDS</text>
  </g>
</svg>
