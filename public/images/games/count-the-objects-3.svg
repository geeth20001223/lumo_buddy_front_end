<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCount" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF" />
      <stop offset="50%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#90CDF4" />
    </linearGradient>

    <linearGradient id="balloonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEB2B2" />
      <stop offset="100%" stop-color="#E53E3E" />
    </linearGradient>

    <linearGradient id="balloonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCBF" />
      <stop offset="100%" stop-color="#D69E2E" />
    </linearGradient>

    <linearGradient id="balloonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D8FD" />
      <stop offset="100%" stop-color="#805AD5" />
    </linearGradient>

    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF089" />
      <stop offset="100%" stop-color="#ECC94B" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1A202C" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGradCount)" />

  <!-- Floating Number Bubbles -->
  <g filter="url(#shadow)">
    <!-- Number 10 Balloon -->
    <ellipse cx="250" cy="140" rx="55" ry="65" fill="url(#balloonPurple)" />
    <path d="M 250 205 Q 245 230 255 260" stroke="#6B46C1" stroke-width="3" fill="none" stroke-dasharray="4,4" />
    <text x="250" y="145" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">10</text>

    <!-- Left Balloon 7 -->
    <ellipse cx="140" cy="190" rx="45" ry="55" fill="url(#balloonRed)" />
    <path d="M 140 245 Q 150 270 145 300" stroke="#C53030" stroke-width="3" fill="none" stroke-dasharray="4,4" />
    <text x="140" y="193" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">7</text>

    <!-- Right Balloon 8 -->
    <ellipse cx="360" cy="190" rx="45" ry="55" fill="url(#balloonYellow)" />
    <path d="M 360 245 Q 350 270 355 300" stroke="#B7791F" stroke-width="3" fill="none" stroke-dasharray="4,4" />
    <text x="360" y="193" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="30" fill="#744210" text-anchor="middle" dominant-baseline="central">8</text>
  </g>

  <!-- Cute Rubber Duckies for Counting -->
  <g filter="url(#shadow)">
    <!-- Duck Body 1 -->
    <path d="M 160 340 C 160 310 190 310 210 330 C 230 330 250 340 240 375 C 230 400 170 400 160 375 Z" fill="url(#duckGrad)" />
    <circle cx="185" cy="330" r="18" fill="url(#duckGrad)" />
    <circle cx="180" cy="325" r="3" fill="#2D3748" />
    <path d="M 170 332 Q 160 336 170 340 Z" fill="#ED8936" />

    <!-- Duck Body 2 -->
    <path d="M 270 340 C 270 310 300 310 320 330 C 340 330 360 340 350 375 C 340 400 280 400 270 375 Z" fill="url(#duckGrad)" />
    <circle cx="295" cy="330" r="18" fill="url(#duckGrad)" />
    <circle cx="290" cy="325" r="3" fill="#2D3748" />
    <path d="M 280 332 Q 270 336 280 340 Z" fill="#ED8936" />
  </g>

  <!-- Level 3 Badge -->
  <g filter="url(#shadow)">
    <rect x="175" y="405" width="150" height="42" rx="21" fill="#3182CE" stroke="#FFFFFF" stroke-width="3" />
    <text x="250" y="428" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">LEVEL 3 COUNT</text>
  </g>
</svg>
