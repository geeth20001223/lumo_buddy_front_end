<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Warm Pastel Rose Background Gradient -->
    <linearGradient id="bgGradEmotion3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="50%" stop-color="#FED7E2" />
      <stop offset="100%" stop-color="#FBB6CE" />
    </linearGradient>

    <!-- Book Cover Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED64A6" />
      <stop offset="100%" stop-color="#B83280" />
    </linearGradient>

    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F687B3" />
      <stop offset="100%" stop-color="#E53E3E" />
    </linearGradient>

    <!-- Gold Star Gradient -->
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E" />
      <stop offset="100%" stop-color="#D69E2E" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadowEm3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#702459" flood-opacity="0.15" />
    </filter>

    <filter id="glowEm3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D53F8C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Circle Frame -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGradEmotion3)" filter="url(#glowEm3)" />

  <!-- Background Decorative Rainbow Arc -->
  <path d="M 100 260 A 150 150 0 0 1 400 260" fill="none" stroke="#FEB2B2" stroke-width="12" opacity="0.5" stroke-linecap="round" />
  <path d="M 120 260 A 130 130 0 0 1 380 260" fill="none" stroke="#FBB6CE" stroke-width="10" opacity="0.6" stroke-linecap="round" />

  <!-- Center Card: Open Storybook of Empathy -->
  <g filter="url(#shadowEm3)">
    <!-- Open Book Pages (Left & Right) -->
    <path d="M 250 170 C 220 155, 140 155, 100 175 L 100 330 C 140 310, 220 310, 250 325 Z" fill="#FFFFFF" stroke="#FBB6CE" stroke-width="3" />
    <path d="M 250 170 C 280 155, 360 155, 400 175 L 400 330 C 360 310, 280 310, 250 325 Z" fill="#FFFFFF" stroke="#FBB6CE" stroke-width="3" />
    
    <!-- Book Spine & Shadow -->
    <line x1="250" y1="170" x2="250" y2="325" stroke="#ED64A6" stroke-width="4" />
  </g>

  <!-- Story Elements inside Open Book -->
  <!-- Left Page: Happy Friend Illustration -->
  <g filter="url(#shadowEm3)">
    <!-- Child Head -->
    <circle cx="175" cy="215" r="22" fill="#FBD38D" />
    <!-- Hair -->
    <path d="M 153 210 C 153 190 197 190 197 210 Z" fill="#744210" />
    <!-- Smile -->
    <path d="M 168 222 Q 175 228 182 222" stroke="#744210" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="168" cy="212" r="2.5" fill="#744210" />
    <circle cx="182" cy="212" r="2.5" fill="#744210" />
    <!-- Shirt -->
    <path d="M 153 237 C 153 237 175 230 197 237 L 197 270 L 153 270 Z" fill="#F687B3" />
  </g>

  <!-- Right Page: Caring Friend with Floating Heart -->
  <g filter="url(#shadowEm3)">
    <!-- Child Head -->
    <circle cx="325" cy="215" r="22" fill="#FED7D7" />
    <!-- Hair -->
    <path d="M 303 210 C 303 185 347 185 347 210 Z" fill="#2C5282" />
    <!-- Smile -->
    <path d="M 318 222 Q 325 228 332 222" stroke="#2C5282" stroke-width="3" fill="none" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="318" cy="212" r="2.5" fill="#2C5282" />
    <circle cx="332" cy="212" r="2.5" fill="#2C5282" />
    <!-- Shirt -->
    <path d="M 303 237 C 303 237 325 230 347 237 L 347 270 L 303 270 Z" fill="#63B3ED" />
  </g>

  <!-- Floating Empathy Heart in Center of Book -->
  <g filter="url(#shadowEm3)">
    <path d="M 250 215 C 250 200 230 190 220 205 C 210 220 250 245 250 245 C 250 245 290 220 280 205 C 270 190 250 200 250 215 Z" fill="url(#heartGrad)" />
  </g>

  <!-- Floating Sparkles & Hearts above Book -->
  <g fill="#D53F8C">
    <!-- Heart 1 -->
    <path d="M 175 130 C 175 120 160 115 153 125 C 146 135 175 150 175 150 C 175 150 204 135 197 125 C 190 115 175 120 175 130 Z" fill="url(#heartGrad)" />
    <!-- Heart 2 -->
    <path d="M 325 130 C 325 120 310 115 303 125 C 296 135 325 150 325 150 C 325 150 354 135 347 125 C 340 115 325 120 325 130 Z" fill="url(#heartGrad)" />
  </g>

  <!-- Gold Star Sparkles -->
  <g fill="url(#goldStar)">
    <path d="M 250 85 L 254 97 L 266 101 L 254 105 L 250 117 L 246 105 L 234 101 L 246 97 Z" />
    <path d="M 80 340 L 83 348 L 91 351 L 83 354 L 80 362 L 77 354 L 69 351 L 77 348 Z" />
    <path d="M 420 340 L 423 348 L 431 351 L 423 354 L 420 362 L 417 354 L 409 351 L 417 348 Z" />
  </g>

  <!-- Level Badge Pill: EMPATHY STORIES -->
  <g filter="url(#shadowEm3)">
    <rect x="150" y="385" width="200" height="44" rx="22" fill="#D53F8C" stroke="#FFFFFF" stroke-width="3" />
    <text x="250" y="407" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">EMPATHY STORIES</text>
  </g>
</svg>
