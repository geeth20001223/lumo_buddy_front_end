<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cool Sky Blue Background Gradient -->
    <linearGradient id="bgGradMem3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF" />
      <stop offset="50%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#63B3ED" />
    </linearGradient>

    <!-- Glowing Card Gradients -->
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E" />
      <stop offset="100%" stop-color="#D69E2E" />
    </linearGradient>

    <linearGradient id="cardCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5" />
      <stop offset="100%" stop-color="#319795" />
    </linearGradient>

    <linearGradient id="cardPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B794F4" />
      <stop offset="100%" stop-color="#805AD5" />
    </linearGradient>

    <linearGradient id="cardOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6AD55" />
      <stop offset="100%" stop-color="#DD6B20" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadowMem3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1A202C" flood-opacity="0.15" />
    </filter>

    <filter id="glowMem3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3182CE" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Circle Frame -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGradMem3)" filter="url(#glowMem3)" />

  <!-- Dotted Spatial Path Connections -->
  <path d="M 150 150 L 350 150 L 350 350 L 150 350 Z" stroke="#3182CE" stroke-width="4" stroke-dasharray="8,8" fill="none" opacity="0.4" />
  <path d="M 150 150 L 350 350" stroke="#DD6B20" stroke-width="4" stroke-dasharray="8,8" fill="none" opacity="0.4" />

  <!-- 3x3 Glowing Memory Cards Grid -->
  <g filter="url(#shadowMem3)">
    <!-- Row 1 -->
    <rect x="100" y="100" width="90" height="90" rx="22" fill="url(#cardGold)" />
    <path d="M 145 125 L 150 140 L 165 141 L 153 150 L 157 165 L 145 156 L 133 165 L 137 150 L 125 141 L 140 140 Z" fill="#FFFFFF" />

    <rect x="205" y="100" width="90" height="90" rx="22" fill="url(#cardCyan)" />
    <circle cx="250" cy="145" r="22" fill="#FFFFFF" opacity="0.9" />

    <rect x="310" y="100" width="90" height="90" rx="22" fill="url(#cardPurple)" />
    <rect x="335" y="125" width="40" height="40" rx="10" fill="#FFFFFF" opacity="0.9" />

    <!-- Row 2 -->
    <rect x="100" y="205" width="90" height="90" rx="22" fill="url(#cardPurple)" />
    <rect x="125" y="230" width="40" height="40" rx="10" fill="#FFFFFF" opacity="0.9" />

    <!-- Active Matched Pair Glow Node in Center -->
    <rect x="205" y="205" width="90" height="90" rx="22" fill="#FFFFFF" stroke="#3182CE" stroke-width="4" />
    <circle cx="250" cy="250" r="24" fill="#3182CE" />
    <path d="M 240 250 L 247 257 L 262 242" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <rect x="310" y="205" width="90" height="90" rx="22" fill="url(#cardGold)" />
    <path d="M 355 230 L 360 245 L 375 246 L 363 255 L 367 270 L 355 261 L 343 270 L 347 255 L 335 246 L 350 245 Z" fill="#FFFFFF" />

    <!-- Row 3 -->
    <rect x="100" y="310" width="90" height="90" rx="22" fill="url(#cardOrange)" />
    <polygon points="145,330 165,365 125,365" fill="#FFFFFF" opacity="0.9" />

    <rect x="205" y="310" width="90" height="90" rx="22" fill="url(#cardCyan)" />
    <circle cx="250" cy="355" r="22" fill="#FFFFFF" opacity="0.9" />

    <rect x="310" y="310" width="90" height="90" rx="22" fill="url(#cardOrange)" />
    <polygon points="355,330 375,365 335,365" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Sparkles -->
  <g fill="#F6E05E">
    <path d="M 250 55 L 254 67 L 266 71 L 254 75 L 250 87 L 246 75 L 234 71 L 246 67 Z" />
    <path d="M 65 350 L 68 358 L 76 361 L 68 364 L 65 372 L 62 364 L 54 361 L 62 358 Z" />
    <path d="M 435 350 L 438 358 L 446 361 L 438 364 L 435 372 L 432 364 L 424 361 L 432 358 Z" />
  </g>

  <!-- Level Badge Pill: SPATIAL PATTERN -->
  <g filter="url(#shadowMem3)">
    <rect x="140" y="395" width="220" height="44" rx="22" fill="#2B6CB0" stroke="#FFFFFF" stroke-width="3" />
    <text x="250" y="417" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SPATIAL PATTERN MATCH</text>
  </g>
</svg>
