<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Sky Blue Gradient -->
    <linearGradient id="bgGradPat2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF" />
      <stop offset="50%" stop-color="#BEE3F8" />
      <stop offset="100%" stop-color="#4299E1" />
    </linearGradient>

    <!-- Tile Colors -->
    <linearGradient id="redTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEB2B2" />
      <stop offset="100%" stop-color="#E53E3E" />
    </linearGradient>

    <linearGradient id="yellowTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCBF" />
      <stop offset="100%" stop-color="#D69E2E" />
    </linearGradient>

    <linearGradient id="greenTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AE6B4" />
      <stop offset="100%" stop-color="#38A169" />
    </linearGradient>

    <linearGradient id="purpleTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D8FD" />
      <stop offset="100%" stop-color="#805AD5" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadowPat2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1A202C" flood-opacity="0.15" />
    </filter>

    <filter id="glowPat2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3182CE" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Circle Frame -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGradPat2)" filter="url(#glowPat2)" />

  <!-- Connecting Pathway Track -->
  <path d="M 80 250 Q 250 150 420 250" stroke="#3182CE" stroke-width="8" stroke-dasharray="12,10" fill="none" opacity="0.5" />

  <!-- Repeating Shape Sequence Line -->
  <g filter="url(#shadowPat2)">
    <!-- Shape 1: Circle (Red) -->
    <rect x="70" y="200" width="70" height="70" rx="18" fill="url(#redTile)" />
    <circle cx="105" cy="235" r="18" fill="#FFFFFF" />

    <!-- Shape 2: Square (Yellow) -->
    <rect x="155" y="165" width="70" height="70" rx="18" fill="url(#yellowTile)" />
    <rect x="175" y="185" width="30" height="30" rx="6" fill="#FFFFFF" />

    <!-- Shape 3: Triangle (Green) -->
    <rect x="240" y="150" width="70" height="70" rx="18" fill="url(#greenTile)" />
    <polygon points="275,168 293,202 257,202" fill="#FFFFFF" />

    <!-- Shape 4: Circle (Red) - Sequence Repeat Starts -->
    <rect x="325" y="165" width="70" height="70" rx="18" fill="url(#redTile)" />
    <circle cx="360" cy="200" r="18" fill="#FFFFFF" />

    <!-- Shape 5: Target Question Mark Tile -->
    <rect x="360" y="260" width="75" height="75" rx="20" fill="#FFFFFF" stroke="#3182CE" stroke-width="4" stroke-dasharray="6,4" />
    <text x="397" y="303" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="38" fill="#2B6CB0" text-anchor="middle">?</text>
  </g>

  <!-- Bottom Option Choices Preview (Square / Triangle / Star) -->
  <g filter="url(#shadowPat2)">
    <rect x="130" y="310" width="240" height="65" rx="20" fill="#FFFFFF" opacity="0.9" stroke="#90CDF4" stroke-width="3" />
    
    <rect x="150" y="322" width="40" height="40" rx="10" fill="url(#yellowTile)" />
    <rect x="162" y="334" width="16" height="16" rx="3" fill="#FFFFFF" />

    <rect x="230" y="322" width="40" height="40" rx="10" fill="url(#greenTile)" />
    <polygon points="250,330 260,350 240,350" fill="#FFFFFF" />

    <rect x="310" y="322" width="40" height="40" rx="10" fill="url(#purpleTile)" />
    <path d="M 330 330 L 333 338 L 341 339 L 334 345 L 336 353 L 330 348 L 324 353 L 326 345 L 319 339 L 327 338 Z" fill="#FFFFFF" />
  </g>

  <!-- Sparkles -->
  <g fill="#F6E05E">
    <path d="M 250 65 L 254 77 L 266 81 L 254 85 L 250 97 L 246 85 L 234 81 L 246 77 Z" />
    <path d="M 65 370 L 68 378 L 76 381 L 68 384 L 65 392 L 62 384 L 54 381 L 62 378 Z" />
    <path d="M 435 370 L 438 378 L 446 381 L 438 384 L 435 392 L 432 384 L 424 381 L 432 378 Z" />
  </g>

  <!-- Level Badge Pill: SHAPE SEQUENCES -->
  <g filter="url(#shadowPat2)">
    <rect x="160" y="395" width="180" height="42" rx="21" fill="#2B6CB0" stroke="#FFFFFF" stroke-width="3" />
    <text x="250" y="417" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SHAPE SEQUENCES</text>
  </g>
</svg>
