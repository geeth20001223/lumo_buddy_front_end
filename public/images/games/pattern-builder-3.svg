<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E0" />
    </linearGradient>

    <linearGradient id="tileRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC8181" />
      <stop offset="100%" stop-color="#E53E3E" />
    </linearGradient>

    <linearGradient id="tileBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63B3ED" />
      <stop offset="100%" stop-color="#3182CE" />
    </linearGradient>

    <linearGradient id="tileYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E" />
      <stop offset="100%" stop-color="#D69E2E" />
    </linearGradient>

    <linearGradient id="tileGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68D391" />
      <stop offset="100%" stop-color="#38A169" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1A202C" flood-opacity="0.15" />
    </filter>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#bgGradPattern)" />

  <!-- Pattern Matrix Tiles 3x3 -->
  <g filter="url(#shadow)">
    <!-- Row 1 -->
    <rect x="110" y="110" width="80" height="80" rx="20" fill="url(#tileRed)" />
    <circle cx="150" cy="150" r="20" fill="#FFFFFF" opacity="0.8" />

    <rect x="210" y="110" width="80" height="80" rx="20" fill="url(#tileBlue)" />
    <polygon points="250,130 265,165 235,165" fill="#FFFFFF" opacity="0.8" />

    <rect x="310" y="110" width="80" height="80" rx="20" fill="url(#tileYellow)" />
    <rect x="335" y="135" width="30" height="30" rx="6" fill="#FFFFFF" opacity="0.8" />

    <!-- Row 2 -->
    <rect x="110" y="210" width="80" height="80" rx="20" fill="url(#tileBlue)" />
    <polygon points="150,230 165,265 135,265" fill="#FFFFFF" opacity="0.8" />

    <rect x="210" y="210" width="80" height="80" rx="20" fill="url(#tileYellow)" />
    <rect x="235" y="235" width="30" height="30" rx="6" fill="#FFFFFF" opacity="0.8" />

    <rect x="310" y="210" width="80" height="80" rx="20" fill="url(#tileGreen)" />
    <path d="M 350 230 L 356 244 L 370 245 L 358 254 L 362 268 L 350 259 L 338 268 L 342 254 L 330 245 L 344 244 Z" fill="#FFFFFF" opacity="0.8" />

    <!-- Row 3 -->
    <rect x="110" y="310" width="80" height="80" rx="20" fill="url(#tileYellow)" />
    <rect x="135" y="335" width="30" height="30" rx="6" fill="#FFFFFF" opacity="0.8" />

    <rect x="210" y="310" width="80" height="80" rx="20" fill="url(#tileGreen)" />
    <path d="M 250 330 L 256 344 L 270 345 L 258 354 L 262 368 L 250 359 L 238 368 L 242 354 L 230 345 L 244 344 Z" fill="#FFFFFF" opacity="0.8" />

    <!-- Question Mark Target Tile -->
    <rect x="310" y="310" width="80" height="80" rx="20" fill="#FAF089" stroke="#D69E2E" stroke-width="4" stroke-dasharray="6,4" />
    <text x="350" y="355" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="42" fill="#744210" text-anchor="middle">?</text>
  </g>
</svg>
